name: Release

# Label-driven versioning: when a PR is merged to main with a semver:major,
# semver:minor or semver:patch label, bump the app version, tag it and publish
# a GitHub Release. PRs without a semver label (docs, CI-only changes, ...)
# do not cut a release.
#
# Requires the RELEASE_PAT repo secret (fine-grained PAT with Contents: read &
# write on this repo). A PAT is used instead of GITHUB_TOKEN so the release
# commit can be pushed to main and so that push still triggers the deploy
# workflows (pushes made with GITHUB_TOKEN do not trigger other workflows).

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  detect:
    # Same-repo guard: fork PRs do not receive RELEASE_PAT, so let detect skip
    # cleanly instead of letting release start and fail at push/gh release.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.label.outputs.bump }}
    steps:
      - name: Detect semver label on merged PR
        id: label
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          echo "PR #$PR_NUMBER labels: $LABELS"

          if [[ ",$LABELS," == *",semver:major,"* ]]; then
            BUMP=major
          elif [[ ",$LABELS," == *",semver:minor,"* ]]; then
            BUMP=minor
          elif [[ ",$LABELS," == *",semver:patch,"* ]]; then
            BUMP=patch
          else
            BUMP=""
          fi

          if [ -z "$BUMP" ]; then
            echo "No semver label on PR #$PR_NUMBER; skipping version bump."
          else
            echo "Will bump: $BUMP"
          fi
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

  release:
    needs: detect
    if: needs.detect.outputs.bump != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Prettier (devDependency) formats the generated version constant.
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        working-directory: ./frontend
        env:
          BUMP: ${{ needs.detect.outputs.bump }}
        run: |
          set -euo pipefail
          case "$BUMP" in
            major|minor|patch) ;;
            *) echo "Refusing to run with unexpected bump: $BUMP"; exit 1 ;;
          esac
          npm run "version:$BUMP"
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      # No [skip ci] on purpose: this commit touches frontend/**, so the push
      # re-triggers the frontend deploy, which is what ships the new
      # APP_VERSION shown in the UI. (It does not touch backend/**.)
      - name: Commit, tag, and push
        env:
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git add frontend/package.json frontend/package-lock.json frontend/src/constants/version.ts
          git commit -m "chore(release): $NEW_VERSION"
          git pull --rebase origin main
          git tag -a "$NEW_VERSION" -m "$NEW_VERSION"
          git push --atomic origin HEAD:main "refs/tags/$NEW_VERSION"

      - name: Create GitHub Release with auto-generated notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          NEW_VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh release create "$NEW_VERSION" \
            --title "$NEW_VERSION" \
            --generate-notes
